# OpenEvolve Default Configuration (commit-based evolution)
# This file lists all available options with sensible defaults.
# Copy it as a starting point and adapt to your repository and evaluator.

# General settings
max_iterations: 10000                 # Maximum number of evolution iterations
checkpoint_interval: 100              # Save checkpoints every N iterations
log_level: "INFO"                    # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_dir: null                         # Custom directory for logs (default: output_dir/logs)
random_seed: 42                       # Random seed for reproducibility (null = random, 42 = default)

# LLM configuration
llm:
  # Shared defaults applied to each model unless overridden below
  defaults:
    api_base: "https://api.openai.com/v1"   # Base URL for API (override for non-OpenAI providers)
    api_key: null                            # API key (defaults to OPENAI_API_KEY env variable)
    system_message: "You are an expert software engineer improving a codebase via commit-based evolution."
    temperature: 0.7                         # Higher = more creative
    top_p: 0.95                              # Nucleus sampling
    max_tokens: 4096                         # Upper bound per response
    timeout: 60                              # Seconds
    retries: 3                               # Number of retries on failure
    retry_delay: 5                           # Seconds between retries
    random_seed: 42

  # Ensemble used to propose edits
  models:
    - name: "gpt-4o-mini"
      weight: 0.8
    - name: "gpt-4o"
      weight: 0.2

  # Optional: models used for LLM-based evaluator feedback
  # If empty, the same set as `models` will be used
  evaluator_models: []

  # Model used when the agent performs multi-file write operations
  write_tool_model: null

  # Optional model used for session compression
  compression_model: null

  # Safety bound for tool loops
  tool_loop_max_steps: 30

# Prompt configuration
prompt:
  template_dir: null                   # Directory with custom prompt templates (optional)
  system_message: "You are an expert coder helping to evolve a repository through safe, incremental commits."
  evaluator_system_message: "You are an expert code reviewer and test designer."

  # Number of examples to include in the prompt
  num_top_programs: 3
  num_diverse_programs: 2

  # Template stochasticity
  use_template_stochasticity: true
  template_variations: {}

  

  # Inspirations in prompt context
  max_inspirations: 2

  # Long-session management (KV-cache friendly)
  session_max_tokens: 120000           # Hard cap per session
  session_compress_threshold: 80000    # Compress historical context beyond this
  recent_history_tokens: 30000         # Keep this many tokens uncompressed

# Database configuration
database:
  # Persistence
  db_path: null                        # Path to persist database (null = in-memory only)
  in_memory: true                      # Keep database in memory for faster access
  log_prompts: true                    # Log prompts/responses per individual

  # Evolutionary parameters
  population_size: 1000                # Max number of individuals in memory
  archive_size: 100                    # Size of elite archive
  num_islands: 5                       # Number of islands for the island model

  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.2
  exploitation_ratio: 0.7

  # Commit-based evolution target and similarity control
  evolution_target: null               # Natural language goal for the evolution run
  signature_similarity_threshold: 0.8  # Consider two commits similar if signature >= this value

  # Git settings
  root_commit: "HEAD"                 # Baseline commit/branch for diff generation
  git_repo_path: "."                 # Path to the repository (usually overridden by CLI arg)
  worktree_base_dir: null              # Defaults to <repo>/.openevolve/worktrees
  git_user_name: "OpenEvolve"
  git_user_email: "openevolve@example.com"

  # MAP-Elites feature map
  feature_dimensions:
    - "complexity"                    # Built-in: code length proxy
    - "diversity"                     # Built-in: structural diversity
  feature_bins: 10                     # Bins per dimension (int or dict per-dimension)
  diversity_reference_size: 20

  # Migration (island model)
  migration_interval: 50               # Migrate every N generations
  migration_rate: 0.1                  # Fraction of top programs to migrate

  # Sampling/inspirations
  num_inspirations: 5

  # Island switching cadence
  island_programs_per_switch: 10

  # Diversity estimation
  island_diversity_sample_size: 5
  island_diversity_max_comparisons: 6
  diversity_cache_size: 1000
  feature_scaling_method: "minmax"

  # MinHash signature
  minhash_num_perm: 64
  minhash_shingle_len: 5

  # Commit message
  commit_message_template: "OpenEvolve iteration {iteration} {commit_message} {metrics}"
  commit_message_max_metrics: 6
  

  # Random seed for database internals (defaults to top-level if null)
  random_seed: 42

# Evaluator configuration
evaluator:
  # General settings
  timeout: 300                         # Maximum evaluation time in seconds
  max_retries: 3                       # Maximum number of retries for evaluation

  # Resource limits (currently not enforced by runtime)
  memory_limit_mb: null
  cpu_limit: null

  # Evaluation strategies
  cascade_evaluation: true             # Use cascade evaluation to filter bad solutions early
  cascade_thresholds:
    - 0.5
    - 0.75
    - 0.9

  # Parallel evaluation
  parallel_evaluations: 1              # Number of concurrent evaluations
  distributed: false                   # Distributed evaluation not yet implemented

  # LLM-based feedback (experimental)
  use_llm_feedback: false
  llm_feedback_weight: 0.1

  

  # Gate committing to repo until evaluation succeeds
  require_evaluate_before_commit: true
